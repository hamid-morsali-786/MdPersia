name: 💡 Feature Request
description: Propose a new feature, diagram engine, or formatting enhancement for MdPersia
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome feature ideas and suggestions to make MdPersia the gold standard for RTL document publishing!

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or limitation is.
      placeholder: Currently, exporting callouts with custom colors requires manual CSS...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
      placeholder: I would like an option `--callout-style modern` that styles notes with rounded borders and icons...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or workarounds you've explored.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any mockups, reference PDFs/Word documents, or links here.
