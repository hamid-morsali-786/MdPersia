[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fa-md-pdf"
version = "0.2.0"
description = "A Windows-friendly CLI to convert Persian/RTL Markdown files with Mermaid diagrams to PDF."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Your Team" }
]
keywords = ["markdown", "pdf", "persian", "rtl", "mermaid", "playwright", "documentation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Documentation",
  "Topic :: Text Processing :: Markup :: Markdown"
]
dependencies = [
  "markdown-it-py>=4.2,<5",
  "playwright>=1.59,<2",
  "python-docx>=1.1,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9"
]

[project.scripts]
fa-md-pdf = "fa_md_pdf.cli:main"
fa-md-pdf-gui = "fa_md_pdf.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fa_md_pdf = ["assets/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
