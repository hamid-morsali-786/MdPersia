[package]
name = "fa-md-pdf-desktop"
version = "0.3.0-beta.3"
description = "Persian Markdown reader, editor and PDF/Word converter"
authors = ["MdPersia contributors"]
edition = "2021"

[lib]
name = "fa_md_pdf_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "MdPersia"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy"] }
tokio = { version = "1", features = ["time"] }
sha2 = "0.10"
zip = { version = "6", default-features = false, features = ["deflate"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
strip = true
